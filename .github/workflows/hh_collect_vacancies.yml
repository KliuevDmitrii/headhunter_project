name: HH Collect Vacancies

on:
  schedule:
    - cron: "0 13 * * 1-5"   # ПН–ПТ, 17:00 Тбилиси (UTC+4)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hh-collect-vacancies
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Collect vacancies
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python -u -m hh_bump.collect

      - name: Save report even if Telegram delivery fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vacancies-report
          path: vacancies.html
          if-no-files-found: ignore
          retention-days: 7

