name: HH Resume Bump

on:
  schedule:
    # Каждый час с 06:00 до 15:00 UTC = 10:00–19:00 по Тбилиси (UTC+4)
    # Только ПН–ПТ
    - cron: "0 6-15 * * 1-5"
  workflow_dispatch:

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run resume bump
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python -u -m hh_bump.main
